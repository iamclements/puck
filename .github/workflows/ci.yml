name: CI

# Checks only. Nothing is published from here: a dev build is cut on demand by
# pushing a dev-N tag (dev-release.yml, tools/tag_dev.sh) and a production
# release by tagging main (release.yml). Pull requests into either long-lived
# branch, and pushes to them, run the same checks. See docs/RELEASING.md.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are noise; a push to dev/main must always finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Two jobs that run side by side: the minified (R8) build is the slowest step
  # by far, so it does not wait behind the tests and lint, and vice versa.
  check:
    name: Tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # One invocation, so Gradle configures once and runs independent tasks in
      # parallel. Conformance tests are the meaningful gate: they check the
      # crypto and wire format byte-for-byte against reference vectors. Lint
      # compiles the debug variant, so a separate debug build would be redundant.
      - name: Protocol tests, app tests and lint
        run: ./gradlew :protocol:test :app:testDebugUnitTest :app:lintDebug --continue

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            protocol/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html

  build:
    name: Minified build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The minified build is what ships; building it on every run catches R8
      # and resource-shrinking breakage before a release, not during one.
      - name: Build minified dev APK
        run: ./gradlew :app:assembleDev

  commitlint:
    # Only meaningful on a PR: a push to main has no "range" of new commits to
    # lint against — main's own history, upstream's included, predates this
    # convention and isn't going to be rewritten to match it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6
