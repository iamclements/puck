name: Release

# Production: pushing a vMAJOR.MINOR.PATCH tag cut from main.
#
# The "prod" environment can require a manual approval (Settings ->
# Environments -> prod -> Required reviewers), so the signed build and the
# publish step wait for a human after the checks have passed.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs main's history and the previous tag
      - name: Check the tag is releasable
        run: python3 tools/check_release.py
        env:
          TAG: ${{ github.ref_name }}

  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need the previous tag's history

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Protocol conformance tests
        run: ./gradlew :protocol:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/release.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Write keystore.properties
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      # The APK is for GitHub and sideloading; the bundle is what Google Play
      # takes. Both are signed with the same upload key.
      - name: Build signed release APK and bundle
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Clean up signing material
        if: always()
        run: rm -f app/release.jks keystore.properties

      - name: Build release notes from Conventional Commits
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: python3 tools/release_notes.py

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/puck-*.apk
            app/build/outputs/bundle/release/app-release.aab
          body_path: RELEASE_NOTES.md
          draft: false

      # Opt-in: set the repository variable PLAY_UPLOAD=true and the secret
      # PLAY_SERVICE_ACCOUNT_JSON once the app exists in Play Console. The
      # bundle lands on the *internal* track; promoting it to production stays
      # a deliberate click in Play Console.
      - name: Upload to Google Play (internal track)
        if: vars.PLAY_UPLOAD == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.danielclements.puck
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
